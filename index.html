<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PDF RAG Agent</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#111118;font-family:'DM Sans',sans-serif;height:100vh;display:flex;overflow:hidden;}
.sidebar{width:240px;flex-shrink:0;background:#0d0d14;border-right:1px solid rgba(255,255,255,0.07);display:flex;flex-direction:column;padding:20px 16px;}
.sidebar-title{font-size:11px;font-weight:500;color:#64748b;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px;}
.drop-zone{border:1.5px dashed rgba(124,106,247,0.35);border-radius:10px;padding:24px 12px;text-align:center;cursor:pointer;transition:all 0.2s;background:rgba(124,106,247,0.04);margin-bottom:12px;}
.drop-zone:hover{border-color:#7c6af7;background:rgba(124,106,247,0.1);}
.drop-zone input{display:none;}
.drop-icon{width:32px;height:32px;margin:0 auto 10px;opacity:0.5;}
.drop-text{font-size:11px;color:#64748b;line-height:1.6;}
.browse-btn{margin-top:10px;background:rgba(124,106,247,0.15);border:1px solid rgba(124,106,247,0.25);color:#a5b4fc;border-radius:6px;padding:6px 14px;font-size:11px;cursor:pointer;font-family:inherit;transition:all 0.2s;width:100%;}
.browse-btn:hover{background:rgba(124,106,247,0.25);}
.file-card{display:none;background:rgba(124,106,247,0.08);border:1px solid rgba(124,106,247,0.2);border-radius:8px;padding:10px 12px;margin-bottom:10px;}
.file-card.show{display:block;}
.file-card-name{font-size:12px;color:#a5b4fc;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.file-card-size{font-size:10px;color:#64748b;}
.process-btn{width:100%;background:#7c6af7;color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;cursor:pointer;font-family:inherit;transition:all 0.2s;font-weight:500;display:none;}
.process-btn:hover{background:#6a58e0;}
.process-btn:disabled{opacity:0.45;cursor:not-allowed;}
.status-pill{display:none;align-items:center;gap:6px;margin-top:12px;padding:7px 10px;border-radius:8px;background:rgba(0,212,170,0.08);border:1px solid rgba(0,212,170,0.2);}
.status-pill.show{display:flex;}
.status-dot{width:6px;height:6px;border-radius:50%;background:#00d4aa;flex-shrink:0;}
.status-text{font-size:11px;color:#5dcaa5;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.main-header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.main-title{font-size:15px;font-weight:500;color:#f1f5f9;}
.main-badge{font-size:10px;color:#64748b;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);padding:3px 9px;border-radius:12px;}
#chat-area{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.06) transparent;}
#chat-area::-webkit-scrollbar{width:3px;}
#chat-area::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px;}
.msg-bot-wrap{display:flex;gap:10px;align-items:flex-start;}
.bot-avatar{width:26px;height:26px;border-radius:7px;background:rgba(124,106,247,0.2);border:1px solid rgba(124,106,247,0.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.bot-bubble{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:4px 14px 14px 14px;padding:12px 15px;font-size:14px;line-height:1.7;color:#cbd5e1;max-width:90%;white-space:pre-wrap;}
.msg-user-wrap{display:flex;justify-content:flex-end;}
.user-bubble{background:#7c6af7;border-radius:14px 14px 4px 14px;padding:10px 15px;font-size:14px;color:#fff;max-width:80%;line-height:1.5;}
.meta-text{font-size:11px;color:#475569;margin-top:5px;padding-left:2px;}
.thinking{display:flex;gap:5px;align-items:center;padding:2px 0;}
.thinking span{width:7px;height:7px;border-radius:50%;background:#7c6af7;opacity:0.6;animation:tb 1.2s infinite;}
.thinking span:nth-child(2){animation-delay:.2s;}
.thinking span:nth-child(3){animation-delay:.4s;}
@keyframes tb{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-6px);}}
.error-bubble{background:rgba(226,75,74,0.08);border:1px solid rgba(226,75,74,0.2);border-radius:10px;padding:10px 14px;font-size:13px;color:#f87171;}
.input-bar{padding:12px 14px;border-top:1px solid rgba(255,255,255,0.06);display:flex;gap:8px;align-items:center;flex-shrink:0;}
.input-bar input{flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:10px 14px;color:#f1f5f9;font-size:14px;font-family:inherit;outline:none;transition:all 0.2s;}
.input-bar input:focus{border-color:rgba(124,106,247,0.4);background:rgba(124,106,247,0.05);}
.input-bar input::placeholder{color:#475569;}
.sum-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:#94a3b8;border-radius:8px;padding:9px 12px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all 0.2s;}
.sum-btn:hover{background:rgba(124,106,247,0.12);border-color:rgba(124,106,247,0.25);color:#a5b4fc;}
.send-btn{background:#7c6af7;border:none;border-radius:8px;width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;}
.send-btn:hover{background:#6a58e0;transform:scale(1.05);}
.send-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.msg-bot-wrap,.msg-user-wrap{animation:fadeUp 0.3s ease;}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-title">Add documents!</div>

  <div class="drop-zone" id="drop-zone"
       onclick="document.getElementById('pdf-input').click()"
       ondragover="event.preventDefault();this.style.borderColor='#7c6af7'"
       ondragleave="this.style.borderColor='rgba(124,106,247,0.35)'"
       ondrop="handleDrop(event)">
    <input type="file" id="pdf-input" accept=".pdf" onchange="handleFile(this.files[0])"/>
    <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="#7c6af7" stroke-width="1.5">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>
    </svg>
    <div class="drop-text">Drag and drop file here<br>Limit 200MB per file • PDF</div>
    <button class="browse-btn">Browse files</button>
  </div>

  <div class="file-card" id="file-card">
    <div class="file-card-name" id="file-name-s">—</div>
    <div class="file-card-size" id="file-size-s"></div>
  </div>

  <button class="process-btn" id="proc-btn" onclick="uploadPDF()">Process PDF</button>

  <div class="status-pill" id="status-pill">
    <div class="status-dot" id="status-dot"></div>
    <span class="status-text" id="status-text">Ready</span>
  </div>
</div>

<div class="main">
  <div class="main-header">
    <span class="main-title">PDF RAG Agent</span>
    <span class="main-badge">Groq · Llama 3.3 70B · FAISS</span>
  </div>

  <div id="chat-area">
    <div class="msg-bot-wrap">
      <div class="bot-avatar">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>
        </svg>
      </div>
      <div class="bot-bubble">Please upload and process a PDF document in the sidebar to start chatting.</div>
    </div>
  </div>

  <div class="input-bar">
    <input id="q-input" type="text" placeholder="Ask a question about your PDF..." autocomplete="off"/>
    <button class="sum-btn" onclick="getSummary()">Summarize</button>
    <button class="send-btn" id="send-btn" onclick="sendQuery()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2" fill="#fff" stroke="none"/>
      </svg>
    </button>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8001';
const qInput = document.getElementById('q-input');
const sendBtn = document.getElementById('send-btn');
const chat = document.getElementById('chat-area');
let pdfReady = false, selectedFile = null;

qInput.addEventListener('keydown', e => { if(e.key==='Enter') sendQuery(); });

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('drop-zone').style.borderColor = 'rgba(124,106,247,0.35)';
  const f = e.dataTransfer.files[0];
  if(f && f.name.endsWith('.pdf')) handleFile(f);
}

function handleFile(f) {
  if(!f) return;
  selectedFile = f;
  document.getElementById('file-name-s').textContent = f.name;
  document.getElementById('file-size-s').textContent = Math.round(f.size/1024) + ' KB';
  document.getElementById('file-card').classList.add('show');
  document.getElementById('proc-btn').style.display = 'block';
}

async function uploadPDF() {
  if(!selectedFile) return;
  const btn = document.getElementById('proc-btn');
  btn.disabled = true; btn.textContent = 'Processing...';
  setStatus('Processing...', '#f59e0b');
  addBot('Processing your PDF — extracting text and building search index...', null);
  const form = new FormData();
  form.append('file', selectedFile);
  try {
    const res = await fetch(`${API}/upload`, {method:'POST', body:form});
    if(!res.ok) throw new Error(await res.text());
    const data = await res.json();
    pdfReady = true;
    btn.textContent = 'Done';
    setStatus(data.chunks + ' chunks indexed', '#00d4aa');
    addBot(`Ready! Indexed ${data.chunks} chunks from "${data.filename}". Ask anything or click Summarize.`, null);
  } catch(e) {
    btn.disabled = false; btn.textContent = 'Process PDF';
    setStatus('Error — retry', '#f87171');
    addError('Upload failed: ' + e.message);
  }
}

function setStatus(text, color) {
  document.getElementById('status-pill').classList.add('show');
  document.getElementById('status-dot').style.background = color;
  document.getElementById('status-text').textContent = text;
  document.getElementById('status-text').style.color = color;
}

async function sendQuery() {
  const q = qInput.value.trim();
  if(!q) return;
  if(!pdfReady) { addError('Please upload and process a PDF first.'); return; }
  qInput.value = '';
  addUser(q);
  const t = addThinking();
  sendBtn.disabled = true;
  try {
    const res = await fetch(`${API}/ask`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question: q})
    });
    if(!res.ok) throw new Error((await res.json()).detail);
    const data = await res.json();
    t.remove();
    addBot(data.answer, `${data.chunks_used} chunks from "${data.filename}"`);
  } catch(e) { t.remove(); addError('Error: ' + e.message); }
  sendBtn.disabled = false; qInput.focus();
}

async function getSummary() {
  if(!pdfReady) { addError('Please upload and process a PDF first.'); return; }
  addUser('Summarize the document');
  const t = addThinking();
  try {
    const res = await fetch(`${API}/summarize`, {method:'POST'});
    if(!res.ok) throw new Error((await res.json()).detail);
    const data = await res.json();
    t.remove();
    addBot(data.answer, `Summary from "${data.filename}"`);
  } catch(e) { t.remove(); addError('Error: ' + e.message); }
}

function addUser(text) {
  const d = document.createElement('div');
  d.className = 'msg-user-wrap';
  d.innerHTML = `<div class="user-bubble">${esc(text)}</div>`;
  chat.appendChild(d); scroll();
}
function addThinking() {
  const d = document.createElement('div');
  d.className = 'msg-bot-wrap';
  d.innerHTML = `<div class="bot-avatar"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg></div><div class="bot-bubble"><div class="thinking"><span></span><span></span><span></span></div></div>`;
  chat.appendChild(d); scroll(); return d;
}
function addBot(answer, meta) {
  const d = document.createElement('div');
  d.className = 'msg-bot-wrap';
  d.innerHTML = `<div class="bot-avatar"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a5b4fc" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg></div><div><div class="bot-bubble">${esc(answer)}</div>${meta?`<div class="meta-text">${esc(meta)}</div>`:''}</div>`;
  chat.appendChild(d); scroll();
}
function addError(msg) {
  const d = document.createElement('div');
  d.className = 'msg-bot-wrap';
  d.innerHTML = `<div class="bot-avatar"></div><div class="error-bubble">${esc(msg)}</div>`;
  chat.appendChild(d); scroll();
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function scroll(){chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'});}
</script>
</body>
</html>
